# Tiny Tapeout project information
project:
  title:        "8-bit Digital Comparator"
  author:       "Baruti Semigambo"
  discord:      ""
  description:  "8-bit digital comparator: A greater than, equal to, or less than B"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_baruti_digital_comparator"

  source_files:
    - "project.v"

pinout:
  # Inputs - A
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "A4"
  ui[5]: "A5"
  ui[6]: "A6"
  ui[7]: "A7"

  # Outputs
  uo[0]: "A_GT_B"
  uo[1]: "A_EQ_B"
  uo[2]: "A_LT_B"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - B
  uio[0]: "B0"
  uio[1]: "B1"
  uio[2]: "B2"
  uio[3]: "B3"
  uio[4]: "B4"
  uio[5]: "B5"
  uio[6]: "B6"
  uio[7]: "B7"

yaml_version: 6